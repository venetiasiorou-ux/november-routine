<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1014"><meta name="apple-mobile-web-app-capable" content="yes"><title>Routine</title><style>
:root{color-scheme:dark;--bg:#0e1014;--card:#181b21;--card2:#20242c;--text:#f5f7fb;--muted:#9ca5b5;--accent:#8fb3ff;--ok:#77d69b;--line:#303640}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
main{max-width:680px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
h1{font-size:28px;margin:6px 0 4px}.sub,.small{color:var(--muted)}.small{font-size:13px}
.progress{background:var(--card);padding:14px;border-radius:18px;margin:16px 0}.bar{height:9px;background:#292e37;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;background:var(--ok);width:0}
.top{display:flex;gap:8px;margin-bottom:15px}.top button{flex:1}
button{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:14px;padding:12px;font-size:15px}.today{border-color:#587bc4}
.date{font-size:20px;font-weight:700;margin:18px 2px 10px}
.task{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-left:5px solid var(--cat);background:color-mix(in srgb,var(--cat) 10%,var(--card));padding:12px;border-radius:16px;margin:8px 0;cursor:pointer}
.taskMain{display:flex;align-items:center;gap:12px;flex:1;min-width:0}.task input{width:24px;height:24px;accent-color:var(--ok);flex:none}.task.done .label{text-decoration:line-through;color:var(--muted)}
.time{font-size:12px;color:#c0cceb;min-width:78px}.label{font-size:16px}.editBtn{flex:none;padding:7px 9px;background:transparent;font-size:18px}
.notes{display:none;margin:-2px 8px 10px 50px;padding:9px 12px;border-left:2px solid var(--line);color:#cbd2de;font-size:14px;white-space:pre-wrap}.notes.show{display:block}
.addBtn{width:100%;margin:14px 0 4px;border:1px dashed #587bc4;color:var(--accent);background:transparent}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(14,16,20,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:9px}nav button{flex:1}
.modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.68);align-items:flex-end;justify-content:center}.modal.show{display:flex}
.sheet{width:100%;max-width:680px;background:#181b21;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 14px}.sheet label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}.sheet input,.sheet textarea,.sheet select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0e1014;color:var(--text);font-size:16px}.sheet textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1}.danger{color:#ff9b9b;border-color:#6a3434}

.monthnav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:14px 0}.monthnav button{flex:1}.modebar{display:flex;gap:8px;margin:12px 0}.modebar button{flex:1}.selected{border-color:#8fb3ff;background:#26344d}.goals{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.goal{background:var(--card);border-radius:14px;padding:12px}.goal .bar{margin-top:7px}.goal .fill{background:#8fb3ff}.goal strong{font-size:14px}.goal .small{margin-top:5px}.templateHint{padding:12px;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:13px}.weeknav{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}.weeknav button{flex:1;min-width:40px;padding:10px 5px}.utility{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.utility button{flex:1;font-size:13px;padding:9px}.empty{padding:24px;text-align:center;color:var(--muted)}nav{position:static;margin:20px -16px -20px;padding:12px 16px calc(18px + env(safe-area-inset-bottom));flex-wrap:wrap}nav button{min-width:115px}main{padding-bottom:40px}
</style></head><body><main>
<h1>Routine</h1><div class="sub">Το πρόγραμμά μου · Νοέμβριος 2026</div>
<div class="monthnav"><strong id="monthName">Νοέμβριος 2026</strong></div>
<div class="progress"><strong id="monthText">Μηνιαία πρόοδος</strong><div class="bar"><div class="fill" id="monthFill"></div></div><div class="small" id="monthStats"></div></div>
<div class="goals" id="goals"></div><button class="addBtn" onclick="addGoal()">＋ Νέος μηνιαίος στόχος</button><div class="small">Ο στόχος μετρά τις ολοκληρωμένες δραστηριότητες με τον ίδιο τίτλο μέσα στον Νοέμβριο. Πάτησε ✎ για αλλαγή ή διαγραφή στόχου.</div>
<div class="modebar"><button id="dailyMode" onclick="setMode('daily')">Ημερήσιο πρόγραμμα</button><button id="templateMode" onclick="setMode('template')">Πρότυπο εβδομάδας</button></div>
<div id="dailyNav" class="top"><button onclick="move(-1)">←</button><button class="today" onclick="goToday()">Σήμερα</button><button onclick="move(1)">→</button></div>
<div id="weekNav" class="weeknav" style="display:none"></div>
<div id="hint"></div><div id="content"></div>
<div class="utility"><button onclick="inspectStorage()">Έλεγχος δεδομένων</button><button onclick="exportData()">Εξαγωγή backup</button><button onclick="document.getElementById('importFile').click()">Εισαγωγή backup</button><input id="importFile" type="file" accept="application/json,.json" style="display:none" onchange="importData(event)"></div>
<nav><button id="clearBtn" onclick="clearChecks()">Καθαρισμός ✓ ημέρας</button><button id="restoreBtn" onclick="restoreDay()">Επαναφορά ημέρας</button></nav>
</main>
<div class="modal" id="modal" onclick="backdrop(event)"><div class="sheet">
<h2 id="modalTitle">Δραστηριότητα</h2>
<label>Ώρα</label><input id="editTime" placeholder="π.χ. 14:00–14:30">
<label>Δραστηριότητα</label><input id="editLabel" placeholder="π.χ. Ζωγραφική">
<label>Κατηγορία</label><select id="editCat">
<option value="routine">Ρουτίνα / προσωπικά</option><option value="hobby">Χόμπι</option><option value="study">Σπουδές</option><option value="food">Φαγητό / έξοδος</option><option value="exercise">Άσκηση</option><option value="free">Ελεύθερος χρόνος</option><option value="errand">Δουλειές / ψώνια</option><option value="commute">Μετακίνηση</option><option value="work">Δουλειά</option><option value="sleep">Ύπνος</option><option value="event">Ραντεβού / event</option></select>
<label>Σημειώσεις</label><textarea id="editNotes" placeholder="Προαιρετικές σημειώσεις..."></textarea>
<div class="actions"><button onclick="closeModal()">Άκυρο</button><button id="deleteBtn" class="danger" onclick="deleteTask()">Διαγραφή</button><button onclick="saveTask()">Αποθήκευση</button></div>
</div></div><script>
"use strict";
const STORE="routine.userData",YEAR=2026;
const COLORS={routine:"#8b95a7",hobby:"#b18cff",study:"#5ca8ff",food:"#f2a65a",exercise:"#58d68d",free:"#5ed5d1",errand:"#f3cf5b",commute:"#a7b0bf",work:"#ff6f7d",sleep:"#7184c7",event:"#ff91c8"};
const BASE={
1:[["11:30–12:00","Πρωινό: καφές / τουαλέτα","routine"],["12:00–13:00","Ζωγραφική","hobby"],["13:00–14:00","Διπλωματική","study"],["14:00–15:00","Φαγητό + άραγμα","food"],["15:00–16:00","Ελεύθερος χρόνος","free"],["16:00–16:50","Προπόνηση","exercise"],["16:50–17:35","Ντους / ετοιμασία","routine"],["17:35–17:45","Μετάβαση στη δουλειά","commute"],["17:45–18:00","Άφιξη / προετοιμασία στη δουλειά","work"],["18:00–03:00","Δουλειά","work"],["03:30–11:30","Ύπνος","sleep"]],
2:[["11:30–12:00","Πρωινό: καφές / τουαλέτα","routine"],["12:00–13:00","Μπάσο","hobby"],["13:00–14:00","Διπλωματική","study"],["14:00–15:00","Φαγητό + άραγμα","food"],["15:00–16:00","Ελεύθερος χρόνος","free"],["16:00–16:50","Προπόνηση","exercise"],["16:50–17:35","Ντους / ετοιμασία","routine"],["17:35–17:45","Μετάβαση στη δουλειά","commute"],["17:45–18:00","Άφιξη / προετοιμασία στη δουλειά","work"],["18:00–03:00","Δουλειά","work"],["03:30–11:30","Ύπνος","sleep"]],
3:[["11:30–12:00","Πρωινό: καφές / τουαλέτα","routine"],["12:00–13:00","Ζωγραφική","hobby"],["13:00–14:00","Διπλωματική","study"],["14:00–15:00","Φαγητό + άραγμα","food"],["15:00–16:00","Ελεύθερος χρόνος","free"],["16:00–16:50","Προπόνηση","exercise"],["16:50–17:35","Ντους / ετοιμασία","routine"],["17:35–17:45","Μετάβαση στη δουλειά","commute"],["17:45–18:00","Άφιξη / προετοιμασία στη δουλειά","work"],["18:00–03:00","Δουλειά","work"],["03:30–11:30","Ύπνος","sleep"]],
4:[["11:30–12:00","Πρωινό: καφές / τουαλέτα","routine"],["12:00–13:00","Καφές έξω (Playlist / μουσική)","food"],["13:00–14:00","Διπλωματική","study"],["14:00–15:00","Καφές έξω","food"],["15:00–16:00","Φαγητό έξω","food"],["16:00–17:35","Supermarket","errand"],["17:35–17:45","Μετάβαση στη δουλειά","commute"],["17:45–18:00","Άφιξη / προετοιμασία στη δουλειά","work"],["18:00–03:00","Δουλειά","work"],["03:30–11:30","Ύπνος","sleep"]],
5:[["11:30–12:00","Πρωινό: καφές / τουαλέτα","routine"],["12:00–13:00","Μπάσο","hobby"],["13:00–14:00","Λούσιμο / περιποίηση","routine"],["14:00–15:00","Φαγητό + άραγμα","food"],["15:00–16:00","Δουλειές σπιτιού","errand"],["16:00–16:50","Ελεύθερος χρόνος","free"],["16:50–17:35","Ετοιμασία","routine"],["17:35–17:45","Μετάβαση στη δουλειά","commute"],["17:45–18:00","Άφιξη / προετοιμασία στη δουλειά","work"],["18:00–03:00","Δουλειά","work"],["03:30–11:30","Ύπνος","sleep"]],
6:[["11:30–12:00","Πρωινό: καφές / τουαλέτα","routine"],["12:00–13:00","Ζωγραφική","hobby"],["13:00–14:00","Free hobby","hobby"],["14:00–15:00","Φαγητό + άραγμα","food"],["15:00–16:00","Supermarket","errand"],["16:00–16:50","Ελεύθερος χρόνος","free"],["16:50–17:35","Ετοιμασία","routine"],["17:35–17:45","Μετάβαση στη δουλειά","commute"],["17:45–18:00","Άφιξη / προετοιμασία στη δουλειά","work"],["18:00–03:00","Δουλειά","work"],["03:30–11:30","Ύπνος","sleep"]],
0:[["11:30–12:00","Πρωινό: καφές / τουαλέτα","routine"],["12:00–13:00","Μπάσο","hobby"],["13:00–14:00","Διπλωματική","study"],["14:00–15:00","Φαγητό + άραγμα","food"],["15:00–16:00","Ελεύθερος χρόνος","free"],["16:00–16:50","Προπόνηση","exercise"],["16:50–17:35","Ντους / ετοιμασία","routine"],["17:35–17:45","Μετάβαση στη δουλειά","commute"],["17:45–18:00","Άφιξη / προετοιμασία στη δουλειά","work"],["18:00–03:00","Δουλειά","work"],["03:30–11:30","Ύπνος","sleep"]]
};
const MONTHS=["Ιανουάριος","Φεβρουάριος","Μάρτιος","Απρίλιος","Μάιος","Ιούνιος","Ιούλιος","Αύγουστος","Σεπτέμβριος","Οκτώβριος","Νοέμβριος","Δεκέμβριος"];
const DAYNAMES=["Κυριακή","Δευτέρα","Τρίτη","Τετάρτη","Πέμπτη","Παρασκευή","Σάββατο"];
const SHORT=["Δε","Τρ","Τε","Πε","Πα","Σα","Κυ"];
const WEEKORDER=[1,2,3,4,5,6,0];

const el=id=>document.getElementById(id);
let today=new Date(),month=10;
let day=(today.getFullYear()===YEAR&&today.getMonth()===10)?today.getDate():1,weekday=1,mode="daily",editing=null;
let db=loadDB();
migrateLegacy();
function loadDB(){try{let x=JSON.parse(localStorage.getItem(STORE)||"null");if(x&&x.version===1&&x.dates){if(!x.templates)x.templates={};if(!Array.isArray(x.goals))x.goals=[];return x}}catch(e){}return {version:1,dates:{},templates:{},goals:[]}}
function saveDB(){localStorage.setItem(STORE,JSON.stringify(db))}
function key(d,m=month){return `${YEAR}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`}
function templateKey(m=month){return `${YEAR}-${String(m+1).padStart(2,"0")}`}
function uid(){return "u"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function clone(x){return JSON.parse(JSON.stringify(x))}
function normalize(x){return {id:x.id||uid(),time:x.time||"",label:x.label||"",cat:x.cat||"event",notes:x.notes||"",done:!!x.done}}
function fromBase(wd){return (BASE[wd]||[]).map((x,i)=>({id:`b${wd}-${i}`,time:x[0],label:x[1],cat:x[2],notes:"",done:false}))}
function getTemplate(wd,m=month){let t=db.templates[templateKey(m)];if(t&&Array.isArray(t[wd]))return t[wd];return []}
function baseTasks(d,m=month){let wd=new Date(YEAR,m,d).getDay();return getTemplate(wd,m).map(x=>({...clone(x),done:false}))}
function currentTasks(d,m=month){let rec=db.dates[key(d,m)];return rec&&Array.isArray(rec.activities)?rec.activities:baseTasks(d,m)}
function materialize(){let k=key(day);if(!db.dates[k])db.dates[k]={activities:baseTasks(day)};return db.dates[k].activities}
function templateTasks(){return getTemplate(weekday)}
function editTemplate(){let k=templateKey();if(!db.templates[k])db.templates[k]={};if(!db.templates[k][weekday])db.templates[k][weekday]=clone(getTemplate(weekday));return db.templates[k][weekday]}
function startMinutes(t){let m=String(t).match(/(\d{1,2}):(\d{2})/);if(!m)return 9999;let v=+m[1]*60+ +m[2];if(v<360)v+=1440;return v}
function sortTasks(a){a.sort((x,y)=>startMinutes(x.time)-startMinutes(y.time))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function migrateLegacy(){
 if(localStorage.getItem("routine.migrationDone")==="1")return;
 try{
  let oldCustom=JSON.parse(localStorage.getItem("octoberRoutine2026.v4.custom")||localStorage.getItem("octoberRoutine2026.custom")||"{}");
  let oldTicks=JSON.parse(localStorage.getItem("octoberRoutine2026.v4.ticks")||localStorage.getItem("octoberRoutine2026")||"{}");
  let changed=false;
  for(let d=1;d<=31;d++){
   if(db.dates[key(d,9)])continue;
   let src=oldCustom[d],ticks=oldTicks[d]||{};
   if(src||Object.keys(ticks).length){
    let arr=Array.isArray(src)?src.map((x,i)=>Array.isArray(x)?normalize({time:x[0],label:x[1],done:!!ticks[i]}):normalize({...x,done:!!ticks[i]})):baseTasks(d,9).map((x,i)=>({...x,done:!!ticks[i]}));
    sortTasks(arr);db.dates[key(d,9)]={activities:arr};changed=true;
   }
  }
  if(changed)saveDB();
 }catch(e){}
 localStorage.setItem("routine.migrationDone","1");
}
function setMode(v){mode=v;render()}

function move(n){let d=day+n,max=new Date(YEAR,month+1,0).getDate();if(d>=1&&d<=max)day=d;render()}
function goToday(){let d=new Date();if(d.getFullYear()===YEAR&&d.getMonth()===10){day=d.getDate()}render()}
function render(){
 el("monthName").textContent=MONTHS[month]+" "+YEAR;
 el("dailyMode").classList.toggle("selected",mode==="daily");el("templateMode").classList.toggle("selected",mode==="template");
 el("dailyNav").style.display=mode==="daily"?"flex":"none";
 el("weekNav").style.display=mode==="template"?"flex":"none";
 el("clearBtn").style.display=mode==="daily"?"":"none";
 el("restoreBtn").textContent=mode==="daily"?"Επαναφορά ημέρας":"Επαναφορά προτύπου";
 if(mode==="template"){
  el("weekNav").innerHTML=SHORT.map((x,i)=>`<button class="${weekday===WEEKORDER[i]?"selected":""}" onclick="weekday=${WEEKORDER[i]};render()">${x}</button>`).join("");
  el("hint").innerHTML='<div class="templateHint">Εδώ φτιάχνεις το σταθερό πρόγραμμα για κάθε ημέρα της εβδομάδας. Οι αλλαγές εφαρμόζονται στις ημερομηνίες αυτού του μήνα που δεν έχουν τροποποιηθεί ξεχωριστά.</div>';
 }else el("hint").innerHTML="";
 let list=mode==="template"?templateTasks():currentTasks(day);
 let n=list.filter(x=>x.done).length;
 let title=mode==="template"?DAYNAMES[weekday]+" · εβδομαδιαίο πρότυπο":DAYNAMES[new Date(YEAR,month,day).getDay()]+" "+day+" "+MONTHS[month];
 el("content").innerHTML=`<div class="date">${title} <span class="small">${mode==="daily"?"· "+n+"/"+list.length:""}</span></div>`+
 (list.length?list.map(x=>`<div><div class="task ${x.done&&mode==="daily"?"done":""}" style="--cat:${COLORS[x.cat]||COLORS.event}" onclick="toggleNotes('${x.id}')"><label class="taskMain" onclick="event.stopPropagation()">${mode==="daily"?`<input type="checkbox" ${x.done?"checked":""} onchange="setDone('${x.id}',this.checked)">`:""}<span class="time">${esc(x.time)}</span><span class="label">${esc(x.label)}</span></label><button class="editBtn" onclick="event.stopPropagation();openEdit('${x.id}')">✎</button></div>${x.notes?`<div class="notes" id="note-${x.id}">${esc(x.notes)}</div>`:""}</div>`).join(""):'<div class="empty">Δεν υπάρχουν δραστηριότητες ακόμα.</div>')+
 `<button class="addBtn" onclick="openAdd()">＋ Προσθήκη δραστηριότητας ${mode==="template"?"στο πρότυπο":""}</button>`;
 updateMonth();
}
function setDone(id,v){let a=materialize(),x=a.find(x=>x.id===id);if(x)x.done=v;saveDB();render()}
function toggleNotes(id){let n=el("note-"+id);if(n)n.classList.toggle("show")}
function openEdit(id){editing=id;let x=(mode==="template"?templateTasks():currentTasks(day)).find(x=>x.id===id);if(!x)return;el("modalTitle").textContent="Επεξεργασία δραστηριότητας";el("editTime").value=x.time;el("editLabel").value=x.label;el("editCat").value=x.cat||"event";el("editNotes").value=x.notes||"";el("deleteBtn").style.display="block";el("modal").classList.add("show")}
function openAdd(){editing=null;el("modalTitle").textContent="Νέα δραστηριότητα";el("editTime").value="";el("editLabel").value="";el("editCat").value="event";el("editNotes").value="";el("deleteBtn").style.display="none";el("modal").classList.add("show")}
function closeModal(){el("modal").classList.remove("show")}
function backdrop(e){if(e.target.id==="modal")closeModal()}
function saveTask(){
 let time=el("editTime").value.trim(),label=el("editLabel").value.trim();
 if(!time||!label){alert("Συμπλήρωσε ώρα και δραστηριότητα.");return}
 let a=mode==="template"?editTemplate():materialize();
 if(editing){let x=a.find(x=>x.id===editing);if(x){x.time=time;x.label=label;x.cat=el("editCat").value;x.notes=el("editNotes").value.trim()}}
 else a.push({id:uid(),time,label,cat:el("editCat").value,notes:el("editNotes").value.trim(),done:false});
 sortTasks(a);saveDB();closeModal();render();
}
function deleteTask(){
 if(!editing)return;
 if(!confirm(mode==="template"?"Να διαγραφεί από το εβδομαδιαίο πρότυπο;":"Να διαγραφεί μόνο από αυτή την ημερομηνία;"))return;
 let a=mode==="template"?editTemplate():materialize(),i=a.findIndex(x=>x.id===editing);
 if(i>=0)a.splice(i,1);saveDB();closeModal();render();
}
function clearChecks(){if(mode!=="daily")return;let a=materialize();a.forEach(x=>x.done=false);saveDB();render()}
function restoreDay(){
 if(mode==="template"){
  if(!confirm("Να επανέλθει το πρότυπο αυτής της ημέρας;"))return;
  let k=templateKey();if(!db.templates[k])db.templates[k]={};
  db.templates[k][weekday]=[];
 }else{
  if(!confirm("Να επανέλθει μόνο αυτή η ημερομηνία στο εβδομαδιαίο πρότυπο;"))return;
  delete db.dates[key(day)];
 }
 saveDB();render();
}

function normalized(s){return String(s||"").trim().toLocaleLowerCase("el").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").replace(/\\s+/g," ")}
function addGoal(){
 let name=prompt("Τίτλος στόχου (ίδιος με τον τίτλο δραστηριότητας, π.χ. Μπάσο):");
 if(name===null)return;name=name.trim();if(!name)return;
 if(db.goals.some(g=>normalized(g)===normalized(name))){alert("Ο στόχος υπάρχει ήδη.");return}
 db.goals.push(name);saveDB();render();
}
function editGoal(i){
 let old=db.goals[i],name=prompt("Άλλαξε τον τίτλο ή άφησε κενό για διαγραφή:",old);
 if(name===null)return;
 name=name.trim();
 if(!name){if(confirm("Να διαγραφεί ο μηνιαίος στόχος «"+old+"»; Οι δραστηριότητες δεν θα διαγραφούν.")){db.goals.splice(i,1);saveDB();render()}return}
 if(db.goals.some((g,j)=>j!==i&&normalized(g)===normalized(name))){alert("Ο στόχος υπάρχει ήδη.");return}
 db.goals[i]=name;saveDB();render();
}
function updateMonth(){
 let total=0,done=0,counts=db.goals.map(()=>({total:0,done:0}));
 let days=30;
 for(let d=1;d<=days;d++)for(const x of currentTasks(d)){
  total++;if(x.done)done++;
  db.goals.forEach((name,i)=>{if(normalized(x.label)===normalized(name)){counts[i].total++;if(x.done)counts[i].done++}});
 }
 let p=total?Math.round(done/total*100):0;
 el("monthText").textContent=`Μηνιαία πρόοδος · ${p}%`;
 el("monthFill").style.width=p+"%";
 el("monthStats").textContent=`${done} από ${total} δραστηριότητες`;
 el("goals").innerHTML=db.goals.map((name,i)=>{
  let c=counts[i],p=c.total?Math.round(c.done/c.total*100):0;
  return `<div class="goal"><div style="display:flex;justify-content:space-between;gap:5px;align-items:center"><strong>${esc(name)}</strong><button style="padding:4px 7px" onclick="editGoal(${i})">✎</button></div><div class="bar"><div class="fill" style="width:${p}%"></div></div><div class="small">${c.done}/${c.total} · ${p}%</div></div>`;
 }).join("");
}
function inspectStorage(){
 const wanted=["october_2026_daily_checklist_v1","octoberRoutine2026","octoberRoutine2026.custom","octoberRoutine2026.v4.ticks","octoberRoutine2026.v4.custom","routine.userData","routine.migrationDone"];
 let found=[];
 for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(wanted.includes(k)||/routine|october/i.test(k)){let v=localStorage.getItem(k)||"";found.push(k+" ("+v.length+" χαρακτήρες)")}}
 alert(found.length?"Βρέθηκαν:\n\n"+found.join("\n")+"\n\nΣτείλε screenshot.":"Δεν βρέθηκαν δεδομένα Routine/October σε αυτό το storage.");
}
function exportData(){
 let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
 let url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="routine-backup-"+new Date().toISOString().slice(0,10)+".json";
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importData(event){
 let file=event.target.files?.[0];event.target.value="";if(!file)return;
 try{
  let obj=JSON.parse(await file.text());
  if(obj.version!==1||!obj.dates||typeof obj.dates!=="object")throw Error("Μη έγκυρο αρχείο.");
  if(!confirm("Η εισαγωγή θα αντικαταστήσει τα δεδομένα της εφαρμογής σε αυτή τη συσκευή. Έχεις κρατήσει backup;"))return;
  db={...obj,templates:obj.templates||{},goals:obj.goals||[]};saveDB();render();alert("Η εισαγωγή ολοκληρώθηκε.");
 }catch(e){alert("Αποτυχία εισαγωγής: "+e.message)}
}
render();
</script></body></html>
